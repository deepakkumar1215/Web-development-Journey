
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Demonstration</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            color: blue;
            text-align: center;
            font-family: Arial;
        }

        p {
            font-size: 18px;
            color: darkgreen;
        }

        .box {
            border: 2px solid black;
            margin: 20px;
            padding: 15px;
        }
    </style>
</head>
<body>

    <h1>Welcome to CSS</h1>

    <p>This paragraph uses internal CSS.</p>

    <div class="box">
        This box demonstrates borders, margins and padding.
    </div>

    <h2 style="color: red; font-family: Georgia;">
        This heading uses inline CSS.
    </h2>

</body>
</html>
